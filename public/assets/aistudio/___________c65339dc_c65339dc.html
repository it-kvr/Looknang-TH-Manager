.mkoOpts .btn.s{margin:0;min-height:30px;padding:4px 9px;font-size:12px}
.mkoMeter{display:flex;align-items:center;gap:8px;margin:8px 0 4px;font-size:12px}
.mkoCounter{padding:8px 10px;border-radius:12px;border:1px solid color-mix(in srgb,var(--lamp) 55%,transparent);background:color-mix(in srgb,var(--lamp) 14%,var(--card));margin-top:8px}
.mkoActs{display:flex;gap:8px;margin-top:10px}
.mkoActs .btn{margin:0;flex:1;min-height:40px}
.finHero{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:6px;margin-bottom:8px}
.finCashBar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0;font-size:12px}
.finActGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:6px;margin-top:6px}
.finActCard{display:flex;flex-direction:column;justify-content:space-between;gap:5px;padding:8px 10px;border-radius:12px;border:1px solid color-mix(in srgb,var(--ink) 10%,transparent);background:color-mix(in srgb,var(--ink) 3%,var(--card))}
.finActCard b{font-size:13px}
.finActCard .btn.s{margin:0;align-self:flex-start}
.finLvBar{display:flex;gap:3px;margin-top:3px}
.finLvBar i{display:block;width:16px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--ink) 12%,transparent)}
.finLvBar i.on{background:var(--g)}
.clubHero{padding:12px!important;border:1px solid color-mix(in srgb,var(--c) 35%,var(--line))}
.clubStats{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:6px;margin-top:8px}
.clubRec{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid color-mix(in srgb,var(--ink) 8%,transparent);font-size:12.5px}
.clubRec:last-child{border-bottom:0}
.clubActs{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:6px;margin-top:6px}
